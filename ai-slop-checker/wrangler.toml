# Lazynext AI Slop Checker — Cloudflare Workers config
#
# Deployment config for the edge entry. api/worker.js is the CommonJS
# implementation (kept require-able by the Node test suite); the deployed
# entry is api/worker-module.mjs — an ES Module wrapper whose
# `export default { fetch }` is what workerd registers as the event
# handler (a pure CJS module.exports bundle is rejected at deploy with
# code 10021 "No event handlers were registered"). account_id is filled
# from the repo .env at deploy time (CLOUDFLARE_ACCOUNT_ID).

name = "lazynext-ai-slop-checker"
main = "api/worker-module.mjs"
compatibility_date = "2024-11-01"
account_id = "85953070bae00da372951a8833bd3459"

# The local Node server (api/server.js) is the primary local entry (port
# 8787); this Workers entry mirrors the same HTTP contract on the edge.
workers_dev = true

# Static assets binding: the whole product tree is uploaded so the worker
# can serve the branded web checker (web/index.html and its parent-relative
# engine refs) same-origin with the API — zero CORS. run_worker_first
# keeps THIS worker in front of every request; api/worker.js gates which
# paths pass through its curated GET/HEAD route map (/web/* /data/* /src/*
# /assets/* /icons/* + the exact web-shell files); everything else 404s,
# so test/ docs/ bench/ scripts/ are uploaded but never served.
# env.ASSETS is the binding name the route map calls.
[assets]
directory = "./"
run_worker_first = true

# Resource hints (no paid features used).
# [observability]
# enabled = true