name: ai-slop-checker CI

# Per-PR quality gate for ai-slop-checker/ plus a daily live-check of the
# deployed worker (https://slop-checker.lazynext.com). Founder-authorized
# 2026-11-19 (full authority for the .github/-gated items).
#
# Install note: ai-slop-checker declares ZERO runtime dependencies and its
# package-lock.json is gitignored (generated for reproducibility), so the
# repo convention here is `npm install`, not `npm ci` — and there is no
# committed lockfile for actions/setup-node to cache on, so no npm cache.
# Matches the existing repo workflows (actions/checkout@v4,
# actions/setup-node@v4, node-version "20", per-dir working-directory).

on:
  push:
    paths:
      - "ai-slop-checker/**"
      - ".github/workflows/ai-slop-checker.yml"
  pull_request:
    paths:
      - "ai-slop-checker/**"
      - ".github/workflows/ai-slop-checker.yml"
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC — live-check of the deployed worker
  workflow_dispatch: # manual kick (runs both jobs)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-slop-checker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (zero declared deps; npm ci needs a committed lockfile)
        run: npm install

      - name: Quality gate — corpus integrity + 425 tests + e2e (26/26)
        run: npm run check

      - name: Eval gate — precision/recall, FP rate (GATE <= 5%)
        run: node bench/eval.js

      - name: Corpus integrity — 5 i18n corpora cross-file (446/32)
        run: node scripts/check-corpus.js data/rules.ru.js data/rules.hi.js data/rules.es.js data/rules.fr.js data/rules.de.js

  live:
    needs: quality # never live-check on a red tree
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-slop-checker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (zero declared deps; npm ci needs a committed lockfile)
        run: npm install

      - name: Live-check slop-checker.lazynext.com (read-only probes)
        run: npm run live

  # Outbound copy quality — the gate that stops unsupported conformance claims
  # reaching a customer, plus the marketing-page regression baseline. Kept as
  # its own job so a copy failure is never mistaken for an engine failure.
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # worker deps first: the sequence check below transpiles the shipped
      # copygate.ts with the worker's own esbuild, so esbuild must exist.
      - name: Worker deps (esbuild ships with wrangler)
        working-directory: worker
        run: npm install

      - name: Worker copy gate — TypeScript rule table
        working-directory: worker
        run: node --test test/copygate.test.mjs

      - name: Fleet copy gate — Python mirror against the shared fixtures
        run: |
          pip install pytest
          PYTHONPATH=. pytest tests/unit/test_copy_quality.py -q

      - name: Shared fixture parity — both runtimes read one file
        run: |
          test -f worker/test/fixtures/copy-quality-cases.json
          echo "fixtures present; parity is asserted by the two suites above"

      - name: Marketing slop gate — regression vs the committed baseline
        run: node scripts/slop_gate.mjs

      - name: Campaign copy — production SEQUENCE still passes the gate
        run: node scripts/copy_check_sequence.mjs