name = "lazynext-marketing"
compatibility_date = "2025-09-01"
main = "./src/index.js"

# The Worker runs first so it can 301 the marketing.lazynext.com host to the
# apex. Every other request is passed straight through to the assets binding,
# which still applies public/_headers and public/_redirects to asset responses.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
