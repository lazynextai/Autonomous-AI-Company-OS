name = "postiz-stack"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
# wrangler builds Dockerfile and pushes to the CF registry on deploy.
# To skip the local build, pin a pushed digest instead:
#   image = "registry.cloudflare.com/85953070bae00da372951a8833bd3459/postiz-stack-postizstack@sha256:8192316a2ce034aa82205ffcb21eb6b22421cada4199f28f5efbc1ac16d2f504"
# tumblr-basic2 = 8192316a base + tumblr.provider.js scopes += 'basic' (both
# backend + orchestrator dist copies; without 'basic' Tumblr issues
# unexchangeable auth codes -> social-connect 500). ENTRYPOINT preserved via
# docker commit --change (first commit a0ae... wait 7578 captured sh -c sed
# as entrypoint -> container start failure; docker commit on an
# --entrypoint-overridden run inherits the override).
image = "registry.cloudflare.com/85953070bae00da372951a8833bd3459/postiz-stack-postizstack@sha256:e6c72b43d9c6f522a408c0d0140dfd44d5f5a93738d9d2c3f3d4973ae36b2ca4"
class_name = "PostizStack"
max_instances = 1
# fat stack: postgres + redis + temporal + node — dev/lite OOM instantly.
instance_type = "standard-4"
constraints = { tiers = [1, 2, 3, 4] }
observability = { enabled = true }

[[durable_objects.bindings]]
name = "POSTIZ"
class_name = "PostizStack"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PostizStack"]
