[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
pidfile=/run/supervisord.pid

# nginx + postgres are started by /opt/entrypoint.sh (port-first + initdb/
# restore ordering) — supervisord owns listmonk and the backup loop.
# All logs go to real files under /data/logs (CF containers have no usable
# stdout device) and logship uploads them to R2 every 30s for debugging.

[program:listmonk]
command=/usr/local/bin/listmonk --config /etc/listmonk.toml
autorestart=true
priority=30
stdout_logfile=/data/logs/listmonk.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/data/logs/listmonk.err.log
stderr_logfile_maxbytes=5MB

[program:heartbeat]
command=/bin/bash -c 'while true; do RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" RCLONE_CONFIG_R2_REGION=auto RCLONE_CONFIG_R2_ACL=private rclone --contimeout 10s --timeout 20s --retries 1 rcat "r2:${R2_BUCKET:-lazynext-media}/listmonk-boot/heartbeat-$(hostname).txt" <<< "$(date -Iseconds)" 2>/dev/null; sleep 60; done'
autorestart=true
priority=50
stdout_logfile=/data/logs/heartbeat.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/data/logs/heartbeat.err.log
stderr_logfile_maxbytes=1MB

[program:logship]
command=/bin/bash -c 'while true; do sleep 30; tar -czf /tmp/logs.tgz -C /data logs 2>/dev/null && RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" RCLONE_CONFIG_R2_REGION=auto RCLONE_CONFIG_R2_ACL=private rclone --contimeout 10s --timeout 60s --retries 1 copyto /tmp/logs.tgz "r2:${R2_BUCKET:-lazynext-media}/listmonk-boot/logs-$(hostname).tgz" 2>/dev/null; done'
autorestart=true
priority=45
stdout_logfile=/data/logs/logship.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/data/logs/logship.err.log
stderr_logfile_maxbytes=1MB

[program:backup]
command=/bin/bash -c "sleep 300; while true; do /opt/backup.sh; sleep 900; done"
autorestart=true
priority=40
stdout_logfile=/data/logs/backup.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/data/logs/backup.err.log
stderr_logfile_maxbytes=1MB
